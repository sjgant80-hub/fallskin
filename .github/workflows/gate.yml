name: gate
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: unit suite
        run: node --test skin.test.mjs
      - name: witness gates the skin kernel
        run: node vendor/witness/witness.mjs mutate skin.mjs --cap 400 --timeout 120000 --test node --test skin.test.mjs
